<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Devotional</title>
  <style>
    :root {
      --bg: #fbf7f0;
      --card-bg: #ffffff;
      --border: #e2d7c5;
      --maroon: #6b1d2f;
      --gold: #b38f4f;
      --gold-light: #f5eedc;
      --text: #2c2523;
      --text-muted: #7a6e67;
      --shadow: 0 4px 12px rgba(107, 29, 47, 0.05);
      --font-serif: "Georgia", "Times New Roman", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }

    .banner {
      background-color: var(--maroon);
      color: var(--gold-light);
      text-align: center;
      padding: 6px 12px;
      font-family: var(--font-serif);
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--gold);
    }

    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .page-header h1 {
      font-family: var(--font-serif);
      color: var(--maroon);
      font-size: 1.8rem;
      font-weight: normal;
    }

    .page-header .sub {
      color: var(--gold);
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.95rem;
    }

    .page-header .desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .field-label {
      font-family: var(--font-serif);
      color: var(--maroon);
      font-size: 0.9rem;
      margin-bottom: 6px;
      display: block;
      font-weight: bold;
    }

    .section-label {
      font-family: var(--font-serif);
      color: var(--maroon);
      font-size: 1.1rem;
      margin: 20px 0 10px 0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background-color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--gold);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-gold {
      background-color: var(--gold);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn-gold:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .icon-btn-gold {
      background: var(--gold);
      color: white;
      border: none;
      border-radius: 6px;
      width: 42px;
      height: 42px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-btn-gold:disabled { opacity: 0.5; }

    .tts-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .inter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .check-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--maroon);
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    .check-circle.done { background: var(--gold-light); }
    .inter-text { flex: 1; font-size: 0.95rem; }
    .inter-text.done { text-decoration: line-through; color: var(--text-muted); }

    .trash-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
    }

    .examen-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }

    .examen-step.done {
      border-color: var(--gold);
      background: var(--gold-light);
    }

    .step-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--maroon);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      flex-shrink: 0;
    }

    .step-badge.done { background: var(--gold); }

    .step-title {
      font-family: var(--font-serif);
      color: var(--maroon);
      font-weight: bold;
      font-size: 0.95rem;
    }

    .step-title.done { text-decoration: line-through; opacity: 0.8; }
    .step-prompt { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .progress-track {
      background: var(--border);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      background: var(--maroon);
      height: 100%;
      transition: width 0.3s ease;
    }

    .examen-done {
      text-align: center;
      padding: 16px;
      color: var(--maroon);
      font-family: var(--font-serif);
      font-style: italic;
    }

    .tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
    }

    .tabbar .rule { height: 2px; background: var(--gold); }
    .tabbar .row { display: flex; max-width: 600px; margin: 0 auto; }

    .tabbar button {
      flex: 1;
      border: none;
      background: none;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-muted);
      cursor: pointer;
    }

    .tabbar button.active { color: var(--maroon); font-weight: bold; }
    .tabbar button .icon { font-size: 1.2rem; }
    .tabbar button .label { font-size: 0.75rem; margin-top: 2px; }

    .fleuron {
      text-align: center;
      color: var(--gold);
      margin: 16px 0;
      font-size: 1.2rem;
    }

    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .entry-header { display: flex; justify-content: space-between; cursor: pointer; }
    .entry-title { font-family: var(--font-serif); color: var(--maroon); font-weight: bold; }
    .entry-date { font-size: 0.8rem; color: var(--text-muted); }
    .sub-text { font-size: 0.9rem; color: var(--text); white-space: pre-wrap; margin-top: 8px; }

    .celebration { display: flex; align-items: center; gap: 10px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .cel-title { font-family: var(--font-serif); color: var(--maroon); font-weight: bold; font-size: 1rem; }
    .cel-rank { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

    .link-btn {
      display: inline-block;
      margin-top: 10px;
      color: var(--maroon);
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .link-btn:hover { text-decoration: underline; }

    .empty { text-align: center; color: var(--text-muted); font-style: italic; padding: 20px 0; }
    .loading { text-align: center; padding: 20px; color: var(--text-muted); }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--maroon);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .err-text { color: #b00020; font-size: 0.85rem; margin-top: 4px; }
  </style>
</head>
  <body>

<div id="app"></div>
<script>
/* ---------- State & Utilities ---------- */
const EXAMEN_STEPS = [
  { n: 1, title: 'Presence of God', prompt: 'Become aware of God\'s loving presence with you right now.' },
  { n: 2, title: 'Gratitude', prompt: 'Review the day and thank God for specific blessings and gifts.' },
  { n: 3, title: 'Review', prompt: 'Notice where God was present, and where you turned away.' },
  { n: 4, title: 'Forgiveness', prompt: 'Ask God for forgiveness for shortfalls and failures today.' },
  { n: 5, title: 'Resolution', prompt: 'Look ahead to tomorrow and ask for grace to follow Him.' }
];

const RANK_LABEL = { 1: 'Solemnity', 2: 'Feast', 3: 'Memorial', 4: 'Optional Memorial', 5: 'Ferial' };

const store = {
  get(k, def) {
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
    catch(e) { return def; }
  },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch(e) { return false; }
  }
};

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fmtDate(dStr) {
  if(!dStr) return '';
  const d = new Date(dStr.includes('T') ? dStr : dStr + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

function setPath(obj, path, val) {
  const parts = path.split('.');
  const last = parts.pop();
  const target = parts.reduce((acc, part) => acc[part] = acc[part] || {}, obj);
  target[last] = val;
}

async function fetchJSONResilient(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) return { ok: false, status: res.status };
    const json = await res.json();
    return { ok: true, json };
  } catch(e) {
    return { ok: false, error: e };
  }
}

/* ---------- App State ---------- */
const state = {
  tab: 'lectio',
  lectio: {
    passage: '', lectioText: '', meditatio: '', oratio: '',
    history: store.get('lectio_history', []),
    expandedId: null, saving: false
  },
  inter: {
    text: '',
    items: store.get('inter_items', [])
  },
  examen: {
    done: store.get('examen_' + todayKey(), {})
  },
  daily: {
    saintLoaded: false, saintLoading: false, saintError: '', saintData: null,
    rssLoaded: false, rssLoading: false, rssError: '', rssItems: [],
    videoLoaded: false, videoLoading: false, videoError: '', videoItems: [],
    bibleQuery: '', bibleLoading: false, bibleError: '', bibleResult: null
  },
  tts: { playingKey: null }
};

/* ---------- Speech Synthesis ---------- */
function toggleSpeak(key) {
  if(!('speechSynthesis' in window)) return;
  if(state.tts.playingKey === key) {
    window.speechSynthesis.cancel();
    state.tts.playingKey = null;
    render();
    return;
  }
  
  window.speechSynthesis.cancel();
  let text = '';

  if(key === 'saint' && state.daily.saintData) {
    const s = state.daily.saintData;
    const cels = s.celebrations || [];
    text = cels.map(c => c.title).join('. ');
  } else if(key === 'bible' && state.daily.bibleResult) {
    text = state.daily.bibleResult.reference + '. ' + state.daily.bibleResult.text;
  }

  if(text) {
    const utter = new SpeechSynthesisUtterance(text);
    utter.onend = () => { state.tts.playingKey = null; render(); };
    utter.onerror = () => { state.tts.playingKey = null; render(); };
    state.tts.playingKey = key;
    window.speechSynthesis.speak(utter);
    render();
  }
}

function ttsButton(key) {
  const isPlaying = state.tts.playingKey === key;
  const label = isPlaying ? 'Stop' : 'Listen';
  return `<button class="tts-btn" data-action="tts" data-key="${key}">${isPlaying ? '&#9632;' : '&#9654;'} ${label}</button>`;
}

function pageHeader(title, sub, desc) {
  return `<div class="page-header">
    <h1>${title}</h1>
    <div class="sub">${sub}</div>
    ${desc ? `<div class="desc">${desc}</div>` : ''}
  </div>`;
}

function fleuron() {
  return `<div class="fleuron">&#10086;</div>`;
}

  <script>
/* ---------- Tab 1: Lectio Divina ---------- */
function renderLectioTab() {
  const s = state.lectio;
  const canSave = (s.passage + s.lectioText + s.meditatio + s.oratio).trim().length > 0;

  let html = pageHeader('Lectio Divina', 'Divine Reading', 'Read, Meditate, Pray, Contemplate');
  html += '<div class="content"><div class="card">';
  html += '<label class="field-label">1. Lectio — Scripture Passage</label>';
  html += '<input type="text" placeholder="e.g. John 15:1-5 or paste verse..." data-bind="lectio.passage" value="'+esc(s.passage)+'" style="margin-bottom:12px;">';
  
  html += '<label class="field-label">Reading Notes</label>';
  html += '<textarea placeholder="What does the text say in itself?" data-bind="lectio.lectioText" style="margin-bottom:12px;">'+esc(s.lectioText)+'</textarea>';

  html += '<label class="field-label">2. Meditatio — Reflection</label>';
  html += '<textarea placeholder="What is God saying to me through this text?" data-bind="lectio.meditatio" style="margin-bottom:12px;">'+esc(s.meditatio)+'</textarea>';

  html += '<label class="field-label">3. Oratio — Prayer</label>';
  html += '<textarea placeholder="What do I say to the Lord in response?" data-bind="lectio.oratio" style="margin-bottom:16px;">'+esc(s.oratio)+'</textarea>';

  html += '<button class="btn-gold" data-action="lectio-save" '+(canSave && !s.saving ? '' : 'disabled')+'>Save Journal Entry</button></div>';

  html += fleuron() + '<div class="section-label">Previous Reflections</div>';
  if(!s.history.length) {
    html += '<div class="empty">No saved reflections yet.</div>';
  } else {
    s.history.forEach(item => {
      const isExp = s.expandedId === item.id;
      html += '<div class="history-card">';
      html += '<div class="entry-header" data-action="lectio-toggle-entry" data-id="'+item.id+'">';
      html += '<div><div class="entry-title">'+esc(item.passage || 'Untitled Reflection')+'</div>';
      html += '<div class="entry-date">'+fmtDate(item.date)+'</div></div>';
      html += '<div>'+(isExp ? '&#9650;' : '&#9660;')+'</div></div>';

      if(isExp) {
        html += '<div style="margin-top:12px; border-top:1px solid var(--border); padding-top:8px;">';
        if(item.lectioText) html += '<div class="field-label" style="margin-top:6px;">Lectio:</div><div class="sub-text">'+esc(item.lectioText)+'</div>';
        if(item.meditatio) html += '<div class="field-label" style="margin-top:6px;">Meditatio:</div><div class="sub-text">'+esc(item.meditatio)+'</div>';
        if(item.oratio) html += '<div class="field-label" style="margin-top:6px;">Oratio:</div><div class="sub-text">'+esc(item.oratio)+'</div>';
        html += '<div style="text-align:right; margin-top:8px;"><button class="trash-btn" data-action="lectio-delete" data-id="'+item.id+'">&#128465; Delete</button></div></div>';
      }
      html += '</div>';
    });
  }
  html += '</div>';
  return html;
}

function saveLectioEntry() {
  const s = state.lectio;
  if(s.saving) return;
  s.saving = true; render();

  const entry = { id: String(Date.now()), date: todayKey(), passage: s.passage.trim(), lectioText: s.lectioText.trim(), meditatio: s.meditatio.trim(), oratio: s.oratio.trim() };
  const next = [entry, ...s.history];
  if(store.set('lectio_history', next)) {
    s.history = next;
    s.passage = ''; s.lectioText = ''; s.meditatio = ''; s.oratio = '';
  }
  s.saving = false;
  render();
}

function deleteLectioEntry(id) {
  const next = state.lectio.history.filter(h => h.id !== id);
  if(store.set('lectio_history', next)) {
    state.lectio.history = next;
    if(state.lectio.expandedId === id) state.lectio.expandedId = null;
    render();
  }
}

/* ---------- Tab 2: Intercessions ---------- */
function renderIntercessionsTab(){
  const s = state.inter;
  let html = pageHeader('Intercessions', 'Prayer Intentions', 'Bring Your Requests to God');
  html += '<div class="content"><div class="add-row">'
    + '<input type="text" placeholder="Add a prayer intention..." data-bind="inter.text" data-enter-action="intercession-add" value="'+esc(s.text)+'">'
    + '<button class="icon-btn-gold" data-action="intercession-add"'+(!s.text.trim()?' disabled':'')+'>+</button></div>';

  if(!s.items.length){
    html += '<div class="empty">No intentions added yet. Write a prayer intention above to begin.</div>';
  } else {
    s.items.forEach(item => {
      html += '<div class="inter-row">'
        + '<button class="check-circle'+(item.done?' done':'')+'" data-action="intercession-toggle" data-id="'+esc(item.id)+'">'+(item.done ? '&#10003;' : '')+'</button>'
        + '<div class="inter-text'+(item.done?' done':'')+'">'+esc(item.text)+'</div>'
        + '<button class="trash-btn" data-action="intercession-delete" data-id="'+esc(item.id)+'">&#128465;</button></div>';
    });
  }
  html += '</div>';
  return html;
}

/* ---------- Tab 3: Examen ---------- */
function renderExamenTab(){
  const s = state.examen;
  const doneCount = Object.values(s.done).filter(Boolean).length;
  const pct = Math.round((doneCount / EXAMEN_STEPS.length) * 100);

  let html = pageHeader('Daily Reflection','Ignatian Examen','Review of the Day');
  html += '<div class="content"><div class="progress-row"><span class="field-label">Daily Progress</span><span class="entry-date">'+doneCount+' of '+EXAMEN_STEPS.length+' steps</span></div>'
    + '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>';

  EXAMEN_STEPS.forEach(step => {
    const isDone = !!s.done[step.n];
    html += '<button class="examen-step'+(isDone?' done':'')+'" data-action="examen-toggle" data-step="'+step.n+'">'
      + '<div class="step-badge'+(isDone?' done':'')+'">'+(isDone?'&#10003;':step.n)+'</div>'
      + '<div style="flex:1;"><div class="step-title'+(isDone?' done':'')+'">'+esc(step.title)+'</div><div class="step-prompt">'+esc(step.prompt)+'</div></div></button>';
  });

  if(doneCount === EXAMEN_STEPS.length){
    html += '<div class="examen-done">&#10021; You have completed today\'s Examen. Rest in God\'s peace.</div>';
  }

  html += '</div>';
  return html;
}

/* ---------- Tab 4: Daily Readings & Calendar ---------- */
function renderDailyTab(){
  const d = state.daily;
  let html = pageHeader('Daily Readings','Feasts &amp; Scripture','Daily Bread');
  html += '<div class="content"><div class="field-row"><div class="section-label" style="margin:0;">Liturgical Calendar</div>'+ttsButton('saint')+'</div>';
  
  if(d.saintLoading){
    html += '<div class="loading"><div class="spinner"></div> Loading liturgical feast&hellip;</div>';
  } else if(d.saintError){
    html += '<div class="err-text">'+esc(d.saintError)+'</div>';
  }
  html += '</div>';
  return html;
}
</script>
</body>
</html>
